<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190">
  <rect width="860" height="190" rx="12" fill="#0d1117"/>

  <style>
    .cell {
      animation: appear 0.6s ease forwards;
      opacity: 0;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .label {
      font-family: monospace;
      font-size: 12px;
      fill: #8b949e;
    }
  </style>

  <text x="20" y="22" class="label">contributions</text>

  <!-- Week 1 -->
  <g>
    <rect class="cell" x="20" y="35" width="12" height="12" rx="3" fill="#161b22"/>
    <rect class="cell" x="20" y="51" width="12" height="12" rx="3" fill="#0e4429"/>
    <rect class="cell" x="20" y="67" width="12" height="12" rx="3" fill="#161b22"/>
    <rect class="cell" x="20" y="83" width="12" height="12" rx="3" fill="#006d32"/>
    <rect class="cell" x="20" y="99" width="12" height="12" rx="3" fill="#26a641"/>
    <rect class="cell" x="20" y="115" width="12" height="12" rx="3" fill="#161b22"/>
    <rect class="cell" x="20" y="131" width="12" height="12" rx="3" fill="#39d353"/>
  </g>

  <!-- Repeated contribution columns -->
  <g fill="#161b22">
    <rect x="38" y="35" width="12" height="12" rx="3"/>
    <rect x="38" y="51" width="12" height="12" rx="3"/>
    <rect x="38" y="67" width="12" height="12" rx="3"/>
    <rect x="38" y="83" width="12" height="12" rx="3"/>
    <rect x="38" y="99" width="12" height="12" rx="3"/>
    <rect x="38" y="115" width="12" height="12" rx="3"/>
    <rect x="38" y="131" width="12" height="12" rx="3"/>

    <rect x="56" y="35" width="12" height="12" rx="3"/>
    <rect x="56" y="51" width="12" height="12" rx="3"/>
    <rect x="56" y="67" width="12" height="12" rx="3"/>
    <rect x="56" y="83" width="12" height="12" rx="3"/>
    <rect x="56" y="99" width="12" height="12" rx="3"/>
    <rect x="56" y="115" width="12" height="12" rx="3"/>
    <rect x="56" y="131" width="12" height="12" rx="3"/>
  </g>

  <!-- More columns -->
  <g fill="#0e4429">
    <rect x="74" y="35" width="12" height="12" rx="3"/>
    <rect x="74" y="51" width="12" height="12" rx="3"/>
    <rect x="74" y="67" width="12" height="12" rx="3"/>
    <rect x="74" y="83" width="12" height="12" rx="3"/>
  </g>

  <g fill="#006d32">
    <rect x="92" y="51" width="12" height="12" rx="3"/>
    <rect x="92" y="67" width="12" height="12" rx="3"/>
    <rect x="92" y="99" width="12" height="12" rx="3"/>
    <rect x="92" y="115" width="12" height="12" rx="3"/>
  </g>

  <g fill="#26a641">
    <rect x="110" y="35" width="12" height="12" rx="3"/>
    <rect x="110" y="67" width="12" height="12" rx="3"/>
    <rect x="110" y="83" width="12" height="12" rx="3"/>
    <rect x="110" y="131" width="12" height="12" rx="3"/>
  </g>

  <g fill="#39d353">
    <rect x="128" y="51" width="12" height="12" rx="3"/>
    <rect x="128" y="83" width="12" height="12" rx="3"/>
    <rect x="128" y="99" width="12" height="12" rx="3"/>
  </g>

  <g fill="#69f0a0">
    <rect x="146" y="67" width="12" height="12" rx="3"/>
    <rect x="146" y="99" width="12" height="12" rx="3"/>
  </g>

  <!-- Fill the remaining grid -->
  <g fill="#161b22">
    <rect x="164" y="35" width="12" height="12" rx="3"/>
    <rect x="164" y="51" width="12" height="12" rx="3"/>
    <rect x="164" y="67" width="12" height="12" rx="3"/>
    <rect x="164" y="83" width="12" height="12" rx="3"/>
    <rect x="164" y="99" width="12" height="12" rx="3"/>
    <rect x="164" y="115" width="12" height="12" rx="3"/>
    <rect x="164" y="131" width="12" height="12" rx="3"/>
  </g>

  <text x="20" y="170" class="label">Less</text>

  <rect x="70" y="160" width="12" height="12" rx="3" fill="#161b22"/>
  <rect x="88" y="160" width="12" height="12" rx="3" fill="#0e4429"/>
  <rect x="106" y="160" width="12" height="12" rx="3" fill="#006d32"/>
  <rect x="124" y="160" width="12" height="12" rx="3" fill="#26a641"/>
  <rect x="142" y="160" width="12" height="12" rx="3" fill="#39d353"/>
  <rect x="160" y="160" width="12" height="12" rx="3" fill="#69f0a0"/>

  <text x="180" y="170" class="label">More</text>
</svg>
